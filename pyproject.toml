[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "multifullstackmade"
version = "0.1.0a1"
description = "A local graph-based AI development team; executable foundation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12.14,<3.13"
dependencies = [
  "jsonschema>=4.26,<5",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "pydantic>=2.14,<3",
]

[project.optional-dependencies]
provider = ["openai>=3.41,<4"]
notes = ["fastapi>=0.162,<1", "uvicorn>=0.54,<1"]
browser = ["pytest-playwright>=0.10,<1"]

[project.scripts]
multifullstackmade = "multifullstackmade.cli:main"

[dependency-groups]
dev = [
  "detect-secrets==1.5.0",
  "hatchling==1.33.0",
  "httpx>=0.28,<1",
  "mypy>=2.4,<3",
  "openapi-spec-validator>=0.9,<1",
  "pip-audit>=2.10,<3",
  "pytest>=9.2,<10",
  "ruff>=0.17,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/multifullstackmade"]

[tool.hatch.build.targets.wheel.force-include]
contracts = "multifullstackmade/contracts"

[tool.hatch.build.targets.sdist]
include = ["src", "contracts", "tests", "scripts", "docs", ".github", "pyproject.toml", "uv.lock", "README*", "LICENSE", ".python-version", ".gitignore", "AGENTS.md", "PROJECT.md", "MEMORY.md", "TASKS.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/multifullstackmade"]
